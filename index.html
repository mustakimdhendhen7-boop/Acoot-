<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acoot Smart Books</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#f5f7fb;color:#172033}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox,.card{background:white;border:1px solid #e4e8ef;border-radius:16px;padding:20px;box-shadow:0 8px 30px #1720330d}.authbox{width:min(420px,100%)}.authbox h1{margin-top:0}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#687386;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #d9dee8;border-radius:9px}.btn{padding:10px 14px;border-radius:9px;border:1px solid #dfe3ea;background:white}.primary{background:#4f46e5;color:white;border-color:#4f46e5}.app{display:flex;min-height:100vh}.side{width:230px;position:fixed;inset:0 auto 0 0;background:#111827;color:white;padding:18px}.logo{font-weight:800;font-size:21px;margin:8px 10px 22px}.logo span{color:#818cf8}.nav button{width:100%;background:transparent;border:0;color:#b9c3d5;text-align:left;padding:11px;border-radius:9px;margin:2px 0}.nav button.active,.nav button:hover{background:#263043;color:white}.main{margin-left:230px;width:calc(100% - 230px);padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.top h1{margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat small{color:#687386}.stat strong{display:block;font-size:24px;margin-top:7px}.section{margin-top:16px}.two{grid-template-columns:2fr 1fr}.page{display:none}.page.active{display:block}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #e7eaf0;text-align:left;white-space:nowrap}.table th{font-size:11px;color:#687386;text-transform:uppercase}.modal{position:fixed;inset:0;background:#0f172a88;display:none;place-items:center;padding:15px;z-index:5}.modal.show{display:grid}.modalbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:white;border-radius:15px;padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.actions{text-align:right;margin-top:14px}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 16px;border-radius:10px}.badge{padding:4px 8px;border-radius:20px;background:#eef2ff;color:#4338ca;font-size:12px}@media(max-width:800px){.side{width:70px}.logo{font-size:0}.logo:after{content:'A';font-size:24px}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:20px}.main{margin-left:70px;width:calc(100% - 70px)}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:550px){.main{padding:12px}.form{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div id="auth" class="auth"><div class="authbox"><h1> Acoot <span style="color:#4f46e5">Smart Books</span></h1><p id="authSub">Sign in to your business account</p><div id="regFields" class="hidden"><div class="field"><label>Name</label><input id="rName"></div><div class="field"><label>Company</label><input id="rCompany" value="My Company"></div></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button id="authBtn" class="btn primary" style="width:100%">Sign in</button><p style="text-align:center"><button class="btn" id="toggle">Create account</button></p><small id="authErr" style="color:#c83a4b"></small></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="logo">Acoot <span>Smart Books</span></div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><small id="companyName"></small></div><div><select id="companySelect" class="btn"></select> <button class="btn" onclick="logout()">Logout</button></div></div><div id="pages"></div></main></div>
<div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),today=()=>new Date().toISOString().slice(0,10);let token=localStorage.getItem('acootToken'),me=null,db={sales:[],purchases:[],expenses:[],customers:[],suppliers:[],products:[],receipts:[]};
async function api(path,opt={}){opt.headers={'Content-Type':'application/json',...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch('/api/'+path,opt),x=r.status===204?null:await r.json();if(!r.ok)throw Error(x?.error||'Request failed');return x}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(x){$('toast').textContent=x;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}
let register=false;$('toggle').onclick=()=>{register=!register;$('regFields').classList.toggle('hidden',!register);$('authBtn').textContent=register?'Create account':'Sign in';$('toggle').textContent=register?'Back to sign in':'Create account';$('authSub').textContent=register?'Create your business account':'Sign in to your business account'};
$('authBtn').onclick=async()=>{try{let x=register?await api('register',{method:'POST',body:JSON.stringify({name:$('rName').value,companyName:$('rCompany').value,email:$('email').value,password:$('password').value})}):await api('login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=x.token;localStorage.setItem('acootToken',token);await boot()}catch(e){$('authErr').textContent=e.message}};
async function boot(){if(!token)return;try{me=await api('me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('companySelect').innerHTML=me.companies.map(c=>`<option value="${c.id}" ${c.id===me.companyId?'selected':''}>${esc(c.name)}</option>`).join('');$('companySelect').onchange=async e=>{await api('switch-company',{method:'POST',body:JSON.stringify({companyId:e.target.value})});await boot()};buildNav();await load()}catch(e){localStorage.removeItem('acootToken');token=null}}
function buildNav(){let items=['dashboard','sales','purchases','customers','suppliers','products','expenses','receipts','reports'];$('nav').innerHTML=items.map((x,i)=>`<button class="${i?'':'active'}" onclick="go('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('');$('pages').innerHTML=`<section id="dashboard" class="page active"><div class="grid" id="stats"></div><div class="grid two section"><div class="card"><div class="head"><h3>Recent sales</h3><button class="btn" onclick="go('sales')">View all</button></div><div id="recent"></div></div><div class="card"><h3>Quick actions</h3><button class="btn primary" style="width:100%;margin:4px 0" onclick="saleForm()">+ Sale</button><button class="btn" style="width:100%;margin:4px 0" onclick="expenseForm()">+ Expense</button><button class="btn" style="width:100%;margin:4px 0" onclick="receiptForm()">AI Receipt</button></div></div></section><section id="sales" class="page"></section><section id="purchases" class="page"></section><section id="customers" class="page"></section><section id="suppliers" class="page"></section><section id="products" class="page"></section><section id="expenses" class="page"></section><section id="receipts" class="page"></section><section id="reports" class="page"></section>`}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.textContent.toLowerCase()===p));$('title').textContent=p[0].toUpperCase()+p.slice(1)}
async function load(){let arr=['sales','purchases','expenses','customers','suppliers','products','receipts'];for(let x of arr)db[x]=await api(x);$('companyName').textContent=me.companies.find(c=>c.id===me.companyId)?.name||'';render()}
function table(id,title,headers,rows,action){$(id).innerHTML=`<div class="card"><div class="head"><h2>${title}</h2><button class="btn primary" onclick="${action}">+ Add</button></div><div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}">No records</td></tr>`}</tbody></table></div></div>`}
function render(){let s=db.sales.reduce((a,x)=>a+(+x.amount||0),0),p=db.purchases.reduce((a,x)=>a+(+x.amount||0),0),e=db.expenses.reduce((a,x)=>a+(+x.amount||0),0);$('stats').innerHTML=[['Sales',s],['Purchases',p],['Expenses',e],['Net Profit',s-p-e]].map(x=>`<div class="card stat"><small>${x[0]}</small><strong>${money(x[1])}</strong></div>`).join('');$('recent').innerHTML=db.sales.slice(0,5).map(x=>`<p><b>${esc(x.no||'Sale')}</b> — ${esc(x.customer||'Walk-in')} <span style="float:right">${money(x.amount)}</span></p>`).join('')||'No sales yet';
table('sales','Sales',['Invoice','Customer','Date','Amount','Status'],db.sales.map(x=>`<tr><td>${esc(x.no)}</td><td>${esc(x.customer)}</td><td>${x.date||''}</td><td>${money(x.amount)}</td><td><span class="badge">${esc(x.status||'Paid')}</span></td></tr>`).join(''),'saleForm()');table('purchases','Purchases',['Reference','Supplier','Date','Amount'],db.purchases.map(x=>`<tr><td>${esc(x.ref)}</td><td>${esc(x.supplier)}</td><td>${x.date||''}</td><td>${money(x.amount)}</td></tr>`).join(''),'purchaseForm()');table('expenses','Expenses',['Date','Category','Note','Amount'],db.expenses.map(x=>`<tr><td>${x.date||''}</td><td>${esc(x.category)}</td><td>${esc(x.note)}</td><td>${money(x.amount)}</td></tr>`).join(''),'expenseForm()');table('customers','Customers',['Name','Phone','GSTIN'],db.customers.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.gst)}</td></tr>`).join(''),'customerForm()');table('suppliers','Suppliers',['Name','Phone','GSTIN'],db.suppliers.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.gst)}</td></tr>`).join(''),'supplierForm()');table('products','Products',['Item','SKU','Price','GST','Stock'],db.products.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.sku)}</td><td>${money(x.price)}</td><td>${x.gst}%</td><td>${x.stock}</td></tr>`).join(''),'productForm()');$('receipts').innerHTML=`<div class="card"><div class="head"><h2>AI Receipt Capture</h2><button class="btn primary" onclick="receiptForm()">Upload receipt</button></div><p>Receipt files are stored in persistent S3-compatible object storage and linked to your company account.</p>${db.receipts.map(x=>`<p><a href="/api/receipts/${encodeURIComponent(x.id)}" target="_blank">${esc(x.fileName||'Receipt')}</a> — ${esc(x.status||'Uploaded')}</p>`).join('')||'<p>No receipts yet.</p>'}</div>`;$('reports').innerHTML=`<div class="grid"><div class="card stat"><small>Revenue</small><strong>${money(s)}</strong></div><div class="card stat"><small>Costs + Expenses</small><strong>${money(p+e)}</strong></div><div class="card stat"><small>Margin</small><strong>${s?((s-p-e)/s*100).toFixed(1):0}%</strong></div><div class="card stat"><small>Transactions</small><strong>${db.sales.length+db.purchases.length+db.expenses.length}</strong></div></div><div class="card section"><h3>Profit & Loss</h3>Revenue: ${money(s)}<br>Purchases: ${money(p)}<br>Expenses: ${money(e)}<br><b>Net profit: ${money(s-p-e)}</b></div>`}
function form(title,fields,save){$('modalbox').innerHTML=`<h2>${title}</h2><div class="form">${fields.map(f=>`<div class="field ${f.full?'full':''}"><label>${f.label}</label>${f.type==='select'?`<select id="f_${f.id}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="f_${f.id}" type="${f.type||'text'}" value="${esc(f.value||'')}">`}</div>`).join('')}</div><div class="actions"><button class="btn" onclick="closeM()">Cancel</button> <button class="btn primary" onclick="${save}">Save</button></div>`;$('modal').classList.add('show')}
const val=id=>$('f_'+id)?.value||'';function closeM(){$('modal').classList.remove('show')}
async function save(c,o){try{await api(c,{method:'POST',body:JSON.stringify(o)});closeM();await load();toast('Saved')}catch(e){toast(e.message)}}
function saleForm(){form('New Sale',[{id:'no',label:'Invoice No',value:'INV-'+String(db.sales.length+1).padStart(4,'0')},{id:'customer',label:'Customer',value:'Walk-in Customer'},{id:'date',label:'Date',type:'date',value:today()},{id:'amount',label:'Total Amount',type:'number',value:0},{id:'status',label:'Status',type:'select',options:['Paid','Pending','Partial']}],"save('sales',{no:val('no'),customer:val('customer'),date:val('date'),amount:+val('amount')||0,status:val('status')})")}
function purchaseForm(){form('New Purchase',[{id:'ref',label:'Reference',value:'PUR-'+Date.now()},{id:'supplier',label:'Supplier'},{id:'date',label:'Date',type:'date',value:today()},{id:'amount',label:'Amount',type:'number',value:0}],"save('purchases',{ref:val('ref'),supplier:val('supplier'),date:val('date'),amount:+val('amount')||0})")}
function expenseForm(){form('New Expense',[{id:'category',label:'Category'},{id:'note',label:'Note'},{id:'amount',label:'Amount',type:'number',value:0}],"save('expenses',{date:today(),category:val('category'),note:val('note'),amount:+val('amount')||0})")}
function customerForm(){form('New Customer',[{id:'name',label:'Name'},{id:'phone',label:'Phone'},{id:'gst',label:'GSTIN'}],"save('customers',{name:val('name'),phone:val('phone'),gst:val('gst')})")}
function supplierForm(){form('New Supplier',[{id:'name',label:'Name'},{id:'phone',label:'Phone'},{id:'gst',label:'GSTIN'}],"save('suppliers',{name:val('name'),phone:val('phone'),gst:val('gst')})")}
function productForm(){form('New Product',[{id:'name',label:'Item'},{id:'sku',label:'SKU'},{id:'price',label:'Price',type:'number',value:0},{id:'gst',label:'GST %',type:'number',value:18},{id:'stock',label:'Opening Stock',type:'number',value:0}],"save('products',{name:val('name'),sku:val('sku'),price:+val('price')||0,gst:+val('gst')||0,stock:+val('stock')||0})")}
function receiptForm(){$('modalbox').innerHTML=`<h2>Upload Receipt</h2><div class="field"><label>Receipt image or PDF</label><input id="receiptInput" type="file" accept="image/*,.pdf"></div><p style="color:#687386;font-size:13px">The file is uploaded directly to the backend and stored in persistent object storage.</p><div class="actions"><button class="btn" onclick="closeM()">Cancel</button> <button class="btn primary" onclick="uploadReceipt()">Upload</button></div>`;$('modal').classList.add('show')}
async function uploadReceipt(){try{const f=$('receiptInput').files[0];if(!f)return toast('Choose a receipt first');const fd=new FormData();fd.append('file',f);const r=await fetch('/api/receipts',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const x=await r.json();if(!r.ok)throw Error(x.error||'Upload failed');closeM();await load();toast('Receipt stored securely')}catch(e){toast(e.message)}}
function logout(){localStorage.removeItem('acootToken');location.reload()}boot();
</script></body></html>
